<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLX Studio</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#f4f6f8; --panel:#ffffff; --panel2:#f8fafb; --text:#14202b; --muted:#687681;
    --line:#d5dde3; --wire:#647782; --accent:#176b87; --accent2:#0b4f66;
    --added:#167a4a; --added-bg:#e9f7ef; --removed:#b63b3b; --removed-bg:#fceeee;
    --changed:#9a6500; --changed-bg:#fff6d9; --shadow:0 10px 30px rgba(20,32,43,.08);
    --grid:rgba(88,108,120,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#12171b; --panel:#1a2126; --panel2:#151b1f; --text:#e8edf0; --muted:#98a6af;
      --line:#334047; --wire:#8ca0aa; --accent:#63b4cf; --accent2:#a6dcec;
      --added:#65c58f; --added-bg:#173526; --removed:#ef8383; --removed-bg:#3c2020;
      --changed:#e1b755; --changed-bg:#3a3017; --shadow:0 10px 30px rgba(0,0,0,.28);
      --grid:rgba(184,201,210,.08);
    }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  button, input, select { font:inherit; }
  button, select, input { color:var(--text); }
  .app { min-height:100vh; display:grid; grid-template-rows:auto 1fr auto; }
  .topbar { min-height:58px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:9px 14px; position:sticky; top:0; z-index:20; }
  .brand { display:flex; align-items:center; gap:10px; min-width:180px; }
  .logo { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white; display:grid; place-items:center; font-weight:800; letter-spacing:-1px; }
  .brand strong { display:block; line-height:1.05; }
  .brand small { color:var(--muted); font-size:11px; }
  .toolbar { display:flex; align-items:center; gap:7px; flex:1; flex-wrap:wrap; }
  .btn, .select, .search { min-height:36px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); }
  .btn { padding:0 11px; cursor:pointer; font-weight:600; }
  .btn:hover { border-color:var(--accent); }
  .btn.active { background:var(--accent); color:white; border-color:var(--accent); }
  .select { padding:0 28px 0 10px; max-width:260px; }
  .search { padding:0 10px; min-width:180px; flex:0 1 250px; }
  .workspace { display:grid; grid-template-columns:230px minmax(360px,1fr) 320px; min-height:0; }
  .sidebar, .inspector { background:var(--panel); min-width:0; overflow:auto; }
  .sidebar { border-right:1px solid var(--line); }
  .inspector { border-left:1px solid var(--line); }
  .pane-title { padding:13px 14px 9px; color:var(--muted); text-transform:uppercase; letter-spacing:.09em; font-size:11px; font-weight:800; }
  .tree { padding:0 8px 14px; }
  .tree-item { width:100%; border:0; background:transparent; color:var(--text); text-align:left; display:flex; gap:8px; align-items:center; padding:8px 9px; border-radius:7px; cursor:pointer; }
  .tree-item:hover, .tree-item.active { background:var(--panel2); }
  .tree-item.active { box-shadow:inset 3px 0 var(--accent); }
  .tree-item .kind { font-size:10px; color:var(--muted); margin-left:auto; }
  .tree-item .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); flex:none; }
  .tree-item[data-status="added"] .dot { background:var(--added); }
  .tree-item[data-status="removed"] .dot { background:var(--removed); }
  .tree-item[data-status="changed"] .dot { background:var(--changed); }
  .canvas-wrap { min-width:0; min-height:620px; position:relative; overflow:hidden; background-color:var(--panel2); background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:22px 22px; }
  #canvas { width:100%; height:100%; min-height:620px; display:block; touch-action:none; user-select:none; }
  .wire { fill:none; stroke:var(--wire); stroke-width:2.2; vector-effect:non-scaling-stroke; opacity:.78; }
  .wire.added { stroke:var(--added); stroke-width:3; }
  .wire.removed { stroke:var(--removed); stroke-width:3; stroke-dasharray:8 5; opacity:.7; }
  .block rect.body { fill:var(--panel); stroke:#687983; stroke-width:1.7; vector-effect:non-scaling-stroke; rx:5; }
  .block text { fill:var(--text); pointer-events:none; }
  .block .type { fill:var(--muted); font-size:10px; }
  .block .name { font-weight:700; font-size:12px; }
  .block.added rect.body { stroke:var(--added); fill:var(--added-bg); stroke-width:2.5; }
  .block.removed rect.body { stroke:var(--removed); fill:var(--removed-bg); stroke-width:2.5; stroke-dasharray:7 4; opacity:.84; }
  .block.changed rect.body { stroke:var(--changed); fill:var(--changed-bg); stroke-width:2.5; }
  .block.selected rect.body { stroke:var(--accent); stroke-width:3.4; filter:drop-shadow(0 5px 6px rgba(0,0,0,.16)); }
  .port { fill:var(--panel2); stroke:var(--wire); stroke-width:1.4; vector-effect:non-scaling-stroke; }
  .block.workbench-editable { cursor:grab; }
  .block.block-dragging { cursor:grabbing; opacity:.9; }
  .port.in, .port.out { pointer-events:all; }
  .block.workbench-editable .port.out { cursor:crosshair; stroke:var(--accent); stroke-width:2; }
  .port.connect-target { fill:var(--accent); stroke:var(--accent); r:6; }
  .wire-preview { fill:none; stroke:var(--accent); stroke-width:2.4; stroke-dasharray:6 4; vector-effect:non-scaling-stroke; pointer-events:none; }
  .floating { position:absolute; right:12px; bottom:12px; display:flex; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:5px; box-shadow:var(--shadow); }
  .floating button { width:38px; height:34px; border:0; border-radius:7px; background:transparent; color:var(--text); cursor:pointer; font-weight:800; }
  .floating button:hover { background:var(--panel2); }
  .legend { position:absolute; left:12px; bottom:12px; display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--muted); background:color-mix(in srgb,var(--panel) 92%,transparent); border:1px solid var(--line); border-radius:9px; padding:7px 9px; }
  .legend span { display:flex; align-items:center; gap:5px; }
  .legend i { width:9px; height:9px; border-radius:3px; border:2px solid currentColor; display:inline-block; }
  .legend .add { color:var(--added); } .legend .del { color:var(--removed); } .legend .chg { color:var(--changed); }
  .empty { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); text-align:center; padding:40px; pointer-events:none; }
  .hidden { display:none !important; }
  .inspector-content { padding:0 14px 20px; }
  .headline { padding:1px 0 12px; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .headline h2 { margin:0 0 4px; font-size:18px; overflow-wrap:anywhere; }
  .headline p { margin:0; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
  .badge { display:inline-flex; align-items:center; border-radius:999px; padding:3px 7px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; border:1px solid var(--line); margin-top:8px; }
  .badge.added { color:var(--added); background:var(--added-bg); border-color:var(--added); }
  .badge.removed { color:var(--removed); background:var(--removed-bg); border-color:var(--removed); }
  .badge.changed { color:var(--changed); background:var(--changed-bg); border-color:var(--changed); }
  .kv { display:grid; grid-template-columns:95px minmax(0,1fr); gap:0; border-top:1px solid var(--line); font-size:12px; }
  .kv > div { padding:8px 5px; border-bottom:1px solid var(--line); min-width:0; overflow-wrap:anywhere; }
  .kv .k { color:var(--muted); font-weight:700; }
  .param-change { display:block; margin-top:3px; font-size:10px; color:var(--changed); }
  .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:0 10px 12px; }
  .stat { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px; text-align:center; }
  .stat strong { display:block; font-size:16px; }
  .stat small { color:var(--muted); font-size:10px; }
  .statusbar { height:28px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 10px; background:var(--panel); border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
  .statusbar strong { color:var(--text); }
  .patch-count { display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 6px; margin-left:5px; border-radius:999px; background:var(--accent); color:white; font-size:10px; }
  .edit-row { display:grid; grid-template-columns:88px minmax(0,1fr); gap:7px; align-items:start; padding:7px 0; border-bottom:1px solid var(--line); }
  .edit-row label { color:var(--muted); font-weight:700; font-size:11px; padding-top:8px; overflow-wrap:anywhere; }
  .edit-control { min-width:0; }
  .param-input { width:100%; min-height:34px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:var(--panel2); color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; }
  .param-input:focus { outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent); border-color:var(--accent); }
  .param-input.staged { border-color:var(--changed); background:var(--changed-bg); }
  .edit-actions { display:flex; gap:6px; margin-top:5px; flex-wrap:wrap; }
  .mini-btn { min-height:29px; padding:0 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel2); color:var(--text); cursor:pointer; font-size:10px; font-weight:700; }
  .mini-btn:hover { border-color:var(--accent); }
  .edit-note { margin-top:3px; color:var(--muted); font-size:10px; overflow-wrap:anywhere; }
  .patch-panel { border-top:1px solid var(--line); margin-top:13px; padding-top:12px; }
  .patch-panel h3 { margin:0 0 8px; font-size:12px; }
  .patch-item { padding:8px; margin-bottom:6px; border:1px solid var(--line); border-radius:7px; background:var(--panel2); font-size:10px; overflow-wrap:anywhere; }
  .patch-item strong { display:block; font-size:11px; margin-bottom:3px; }
  .bridge-pill { display:inline-flex; align-items:center; gap:6px; min-height:30px; padding:0 9px; border:1px solid var(--line); border-radius:999px; font-size:10px; color:var(--muted); background:var(--panel2); }
  .bridge-pill::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--muted); }
  .bridge-pill.ready::before { background:var(--added); }
  .bridge-pill.missing::before { background:var(--changed); }
  .run-group { display:flex; align-items:center; gap:5px; }
  .stop-input { width:70px; min-height:36px; padding:0 8px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--text); }
  .toast { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:15; max-width:min(560px,calc(100% - 30px)); padding:9px 12px; border:1px solid var(--line); border-radius:9px; background:var(--panel); box-shadow:var(--shadow); font-size:11px; }
  .toast.error { border-color:var(--removed); color:var(--removed); }

  .lang-select { min-width:104px; max-width:112px; }
  .review-panel { padding:0 8px 12px; }
  .review-heading { display:flex; align-items:center; justify-content:space-between; gap:7px; padding:3px 4px 7px; color:var(--muted); font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
  .review-card { width:100%; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--text); padding:8px; margin-bottom:6px; text-align:left; cursor:pointer; }
  .review-card:hover { border-color:var(--accent); }
  .review-card.active { border-color:var(--accent); box-shadow:inset 3px 0 var(--accent); }
  .review-card-top { display:flex; gap:7px; align-items:center; }
  .review-card strong { min-width:0; overflow-wrap:anywhere; font-size:11px; }
  .review-meta { color:var(--muted); font-size:9px; margin-top:4px; }
  .priority-pill { display:inline-flex; align-items:center; justify-content:center; min-width:42px; padding:2px 6px; border-radius:999px; font-size:9px; font-weight:900; text-transform:uppercase; border:1px solid currentColor; }
  .priority-high { color:var(--removed); }
  .priority-medium { color:var(--changed); }
  .priority-low { color:var(--added); }
  .review-callout { margin:0 0 12px; padding:10px; border:1px solid var(--line); border-left-width:4px; border-radius:8px; background:var(--panel2); }
  .review-callout.priority-high { border-left-color:var(--removed); }
  .review-callout.priority-medium { border-left-color:var(--changed); }
  .review-callout.priority-low { border-left-color:var(--added); }
  .review-callout h3 { margin:0 0 4px; color:var(--text); font-size:12px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .review-callout p { margin:4px 0 0; color:var(--muted); font-size:10px; }
  .reason-list { margin:7px 0 0; padding-left:18px; color:var(--text); font-size:10px; }
  .reason-list li { margin:3px 0; }
  .block.impact rect.body { stroke:var(--accent); stroke-width:3.2; }
  .block.impact-dim { opacity:.25; }
  .wire.impact { stroke:var(--accent); stroke-width:3.4; opacity:1; }
  .wire.impact-dim { opacity:.16; }
  .review-score { font-size:9px; font-weight:900; text-anchor:end; }
  .review-score.high { fill:var(--removed); }
  .review-score.medium { fill:var(--changed); }
  .review-score.low { fill:var(--added); }
  .review-disclaimer { margin:8px 4px 0; color:var(--muted); font-size:9px; line-height:1.35; }
  .ai-form { display:grid; gap:9px; }
  .ai-field { display:grid; gap:4px; }
  .ai-field label { color:var(--muted); font-size:10px; font-weight:800; }
  .ai-field input, .ai-field select, .ai-field textarea { width:100%; border:1px solid var(--line); border-radius:7px; background:var(--panel2); color:var(--text); padding:8px; font:inherit; font-size:11px; }
  .ai-field textarea { min-height:112px; resize:vertical; line-height:1.4; }
  .ai-actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .ai-note { padding:8px; border:1px solid var(--line); border-radius:7px; background:var(--panel2); color:var(--muted); font-size:9px; line-height:1.45; }
  .ai-result { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .ai-result pre { margin:6px 0; padding:8px; max-height:220px; overflow:auto; white-space:pre-wrap; border:1px solid var(--line); border-radius:7px; background:var(--panel2); color:var(--text); font-size:10px; line-height:1.45; }
  .ai-trace { display:grid; gap:5px; margin-top:8px; }
  .ai-trace-item { border-left:3px solid var(--accent); padding:5px 7px; background:var(--panel2); font-size:9px; overflow-wrap:anywhere; }
  .unsupported-notice { margin:0 8px 10px; padding:8px 9px; border:1px solid var(--changed); border-left-width:4px; border-radius:8px; background:var(--changed-bg); color:var(--text); font-size:10px; line-height:1.4; }
  .large-model-notice { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:5; max-width:min(720px,calc(100% - 28px)); padding:7px 10px; border:1px solid var(--changed); border-radius:8px; background:color-mix(in srgb,var(--panel) 94%,var(--changed-bg)); color:var(--text); font-size:10px; line-height:1.35; box-shadow:var(--shadow); }
  .overview-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin-bottom:12px; }
  .overview-stat { padding:9px 8px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); }
  .overview-stat strong { display:block; font-size:16px; line-height:1.1; }
  .overview-stat span { color:var(--muted); font-size:10px; }
  .overview-list { margin:8px 0 0; padding-left:17px; color:var(--text); font-size:11px; }
  .overview-list li { margin:4px 0; overflow-wrap:anywhere; }
  .overview-note { margin-top:12px; padding:8px 9px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--muted); font-size:10px; line-height:1.4; }
  .ai-check { display:flex; align-items:flex-start; gap:7px; color:var(--text); font-size:10px; }
  .ai-check input { margin-top:2px; }
  @media (max-width: 980px) {
    .workspace { grid-template-columns:180px minmax(320px,1fr); }
    .inspector { grid-column:1 / -1; border-left:0; border-top:1px solid var(--line); max-height:300px; }
  }
  @media (max-width: 680px) {
    .brand { min-width:auto; } .brand small { display:none; }
    .workspace { display:block; }
    .sidebar { border-right:0; border-bottom:1px solid var(--line); max-height:180px; }
    .canvas-wrap, #canvas { min-height:500px; }
    .inspector { max-height:none; }
    .select, .search { max-width:100%; min-width:120px; }
    .legend { right:12px; bottom:58px; }
  }
</style>
</head>
<body>
<div class="app" id="studio">
  <header class="topbar">
    <div class="brand"><div class="logo">S</div><div><strong>SLX Studio</strong><small id="modelSubtitle">Visual model explorer</small></div></div>
    <div class="toolbar">
      <div id="modeButtons"></div>
      <select class="select" id="systemSelect" aria-label="Subsystem"></select>
      <input class="search" id="searchBox" type="search" placeholder="Find block…" aria-label="Find block">
      <button class="btn hidden" id="addBlockButton" type="button">+ Block</button>
      <button class="btn hidden" id="reviewButton" type="button">Review Lens</button>
      <button class="btn" id="fitButton" type="button">Fit</button>
      <button class="btn" id="exportButton" type="button">Export SVG</button>
      <button class="btn hidden" id="agentContextButton" type="button">Agent Context</button>
      <button class="btn hidden" id="aiButton" type="button">Connect AI</button>
      <button class="btn" id="overviewButton" type="button">Overview</button>
      <button class="btn" id="patchButton" type="button">Patch <span class="patch-count" id="patchCount">0</span></button>
      <button class="btn" id="downloadPatchButton" type="button">Download Patch</button>
      <span class="bridge-pill" id="bridgePill">Standalone editor</span>
      <button class="btn hidden" id="applyButton" type="button">Apply in MATLAB</button>
      <span class="run-group hidden" id="runGroup"><input class="stop-input" id="stopTime" inputmode="decimal" value="10" aria-label="Simulation stop time"><button class="btn" id="simulateButton" type="button">Run Simulation</button></span>
      <select class="select lang-select" id="languageSelect" aria-label="Language"><option value="en">English</option><option value="zh">中文</option></select>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <div class="pane-title" id="modelExplorerTitle">Model Explorer</div>
      <div id="summary" class="summary hidden"></div>
      <div id="unsupportedNotice" class="unsupported-notice hidden" role="note"></div>
      <div id="reviewPanel" class="review-panel hidden"></div>
      <div class="tree" id="tree"></div>
    </aside>

    <section class="canvas-wrap" id="canvasWrap" aria-label="Model diagram">
      <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
      <svg id="canvas" viewBox="0 0 1000 700" role="img" aria-label="Simulink model visualization">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--wire)"></path></marker>
          <marker id="arrow-added" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--added)"></path></marker>
          <marker id="arrow-removed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--removed)"></path></marker>
        </defs>
        <g id="viewport"><g id="wires"></g><path id="connectPreview" class="wire-preview hidden" d=""></path><g id="blocks"></g></g>
      </svg>
      <div class="empty hidden" id="empty">No blocks in this subsystem.</div>
      <div class="large-model-notice hidden" id="largeModelNotice" role="status"></div>
      <div class="legend" id="legend"><span class="add"><i></i><b id="legendAdded">Added</b></span><span class="chg"><i></i><b id="legendChanged">Changed</b></span><span class="del"><i></i><b id="legendRemoved">Removed</b></span></div>
      <div class="floating"><button id="zoomOut" type="button" aria-label="Zoom out">−</button><button id="zoomIn" type="button" aria-label="Zoom in">+</button><button id="resetView" type="button" aria-label="Reset view">⌂</button></div>
    </section>

    <aside class="inspector">
      <div class="pane-title" id="inspectorTitle">Inspector</div>
      <div class="inspector-content" id="inspector"><p style="color:var(--muted);font-size:12px">Model overview is shown here; select a block to inspect its parameters.</p></div>
    </aside>
  </main>

  <footer class="statusbar"><span id="statusLeft"><strong>Ready</strong></span><span id="statusRight">Standalone editor · patch export ready</span></footer>
</div>
<script id="slx-data" type="application/json">__SLX_STUDIO_PAYLOAD__</script>
<script>
(() => {
  const payload = JSON.parse(document.getElementById('slx-data').textContent);
  const $ = (id) => document.getElementById(id);
  const svg = $('canvas'), viewport = $('viewport'), blockLayer = $('blocks'), wireLayer = $('wires'), connectPreview = $('connectPreview');
  const tree = $('tree'), inspector = $('inspector'), systemSelect = $('systemSelect'), searchBox = $('searchBox');
  const legend = $('legend'), empty = $('empty'), summary = $('summary'), reviewPanel = $('reviewPanel');
  const editor = payload.editor || {patch_schema_version:'0.1',model_name:'',source_sha256:'',bridge:{enabled:false}};
  const review = payload.review || null;

      g.append(rect,name,type);const pc=window.__portCounts.get(b.path)||{in:1,out:1};
      for(let i=1;i<=pc.in;i++){const pin=make('circle',{class:'port in',cx:0,cy:p.h*i/(pc.in+1),r:4.3});pin.dataset.path=b.path;pin.dataset.port=String(i);g.appendChild(pin)}
      for(let i=1;i<=pc.out;i++){const pout=make('circle',{class:'port out',cx:p.w,cy:p.h*i/(pc.out+1),r:4.3});pout.dataset.path=b.path;pout.dataset.port=String(i);if(editable)pout.addEventListener('pointerdown',e=>startConnection(e,b,p,i));g.appendChild(pout)}
      const item=reviewForBlock(b);if(reviewLens&&mode==='diff'&&item){const score=make('text',{class:`review-score ${item.priority}`,x:p.w-5,y:11});score.textContent=String(item.score);g.appendChild(score)}
      if(editable)g.addEventListener('pointerdown',e=>beginBlockMove(e,b,p,g));
      g.addEventListener('click',e=>{e.stopPropagation();selectBlock(b.id,false)});g.addEventListener('dblclick',e=>{if(String(b.block_type).toLowerCase()==='subsystem'){e.preventDefault();e.stopPropagation();openSubsystem(b)}});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectBlock(b.id,false)}});blockLayer.appendChild(g)
    }
    empty.classList.toggle('hidden',allBlocks.length>0); renderTree(allBlocks); renderReviewPanel(); renderUnsupportedNotice();
    const largeNotice=$('largeModelNotice');
    if(allBlocks.length>LARGE_MODEL_RENDER_LIMIT){largeNotice.classList.remove('hidden');largeNotice.textContent=t('largeModelNotice',{rendered:renderBlocks.length,total:allBlocks.length});}else{largeNotice.classList.add('hidden');largeNotice.textContent='';}
    if(selectedId && !allBlocks.some(b=>b.id===selectedId)){selectedId=null;showInspector(null)} else if(selectedId) showInspector(currentSelectedBlock()); else if(inspectorMode==='overview') showInspector(null);
    applySelectionAndImpact(); $('statusLeft').innerHTML=`<strong>${allBlocks.length}</strong> ${t('blocks')} · <strong>${allLines.length}</strong> ${t('connections')}`; setTimeout(fitView,0);
  }
  function populateSystems() {
    const previous=systemSelect.value; systemSelect.innerHTML='';
    for(const s of allSystems()){const opt=document.createElement('option');opt.value=s.id;const label=(s.label==='Root'&&lang==='zh')?'根系统':s.label;opt.textContent=`${label} (${s.block_count})`;systemSelect.appendChild(opt)}
    if([...systemSelect.options].some(o=>o.value===previous)) systemSelect.value=previous;
  }
  function clearAgentPreview() {
    agentPreview=null; mode=payload.mode==='diff'?'diff':'model'; selectedId=null; inspectorMode='overview';
    $('modelSubtitle').textContent=payload.mode==='diff'?`${payload.old.name} → ${payload.new.name}`:payload.model.name;
    setupModes(); populateSystems(); render(); showInspector(null);
  }
  function setMode(next) {
    agentPreview=null; mode=next; selectedId=null; inspectorMode='overview'; for(const b of document.querySelectorAll('#modeButtons .btn')) b.classList.toggle('active',b.dataset.mode===mode); populateSystems(); legend.classList.toggle('hidden',mode!=='diff'); render();
  }
  function setupModes(){
    const box=$('modeButtons');box.innerHTML='';
    if(agentPreview){const a=document.createElement('button');a.type='button';a.className='btn active';a.textContent=t('aiPreview');box.appendChild(a);const back=document.createElement('button');back.type='button';back.className='btn';back.textContent=t('backModel');back.addEventListener('click',clearAgentPreview);box.appendChild(back);legend.classList.add('hidden');return;}
    if(payload.mode==='diff'){for(const [value,key] of [['diff','modeDiff'],['after','modeAfter'],['before','modeBefore']]){const b=document.createElement('button');b.type='button';b.className='btn'+(value===mode?' active':'');b.dataset.mode=value;b.textContent=t(key);b.addEventListener('click',()=>setMode(value));box.appendChild(b)}}else{legend.classList.add('hidden')}
  }
  function setupSummary(){if(payload.mode!=='diff'){summary.classList.add('hidden');return;}summary.classList.remove('hidden');const s=payload.summary;summary.innerHTML=`<div class="stat"><strong>${s.change_count}</strong><small>${t('changes')}</small></div><div class="stat"><strong>${s.changed_blocks}</strong><small>${t('modified')}</small></div><div class="stat"><strong>${s.added_blocks+s.removed_blocks}</strong><small>${t('plusBlocks')}</small></div>`;}
  function exportSvg(){const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');const style=document.createElementNS('http://www.w3.org/2000/svg','style');style.textContent='text{font-family:Arial,sans-serif}.wire{fill:none;stroke:#647782;stroke-width:2}.block rect{fill:white;stroke:#687983;stroke-width:2}.block text{fill:#14202b}.name{font-weight:700;font-size:12px}.type{font-size:10px;fill:#687681}.added rect{stroke:#167a4a}.removed rect{stroke:#b63b3b;stroke-dasharray:7 4}.changed rect{stroke:#9a6500}.port{fill:white;stroke:#647782}';clone.insertBefore(style,clone.firstChild);const blob=new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(sourceModel().name||'model')+'-slx-studio.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function toggleReviewLens(){reviewLens=!reviewLens;$('reviewButton').classList.toggle('active',reviewLens);toast(reviewLens?t('reviewOn'):t('reviewOff'));render();}
  function applyLanguage() {
    document.documentElement.lang=lang==='zh'?'zh-CN':'en'; $('languageSelect').value=lang;
    $('reviewButton').textContent=t('reviewLens'); $('fitButton').textContent=t('fit'); $('exportButton').textContent=t('exportSvg'); $('agentContextButton').textContent=t('agentContext'); $('aiButton').textContent=t('connectAI');
    $('patchButton').innerHTML=`${t('patch')} <span class="patch-count" id="patchCount">${staged.size}</span>`; $('downloadPatchButton').textContent=t('downloadPatch'); $('applyButton').textContent=workbenchMode?t('saveModel'):t('applyMatlab'); $('simulateButton').textContent=t('runSimulation'); $('addBlockButton').textContent=t('addBlock');
    $('modelExplorerTitle').textContent=t('modelExplorer'); $('inspectorTitle').textContent=t('inspector'); $('overviewButton').textContent=t('overview'); $('empty').textContent=t('empty'); $('legendAdded').textContent=t('added'); $('legendChanged').textContent=t('changed'); $('legendRemoved').textContent=t('removed'); renderUnsupportedNotice();
    searchBox.placeholder=t('findBlock'); searchBox.setAttribute('aria-label',t('findBlock')); systemSelect.setAttribute('aria-label',t('subsystem')); $('languageSelect').setAttribute('aria-label',t('language')); $('stopTime').setAttribute('aria-label',t('stopTimeAria'));
    setupModes(); setupSummary(); populateSystems(); updateBridgeText(); render(); updatePatchUI();
    if(inspectorMode==='patch') showPatchQueue(); else if(inspectorMode==='simulation'&&lastSimulation) showSimulationResult(lastSimulation); else if(inspectorMode==='ai') showAIPanel(); else if(selectedId) showInspector(currentSelectedBlock());
  }

  $('fitButton').addEventListener('click',fitView); $('resetView').addEventListener('click',fitView); $('zoomIn').addEventListener('click',()=>{const r=svg.getBoundingClientRect();zoomAt(1.22,r.width/2,r.height/2)}); $('zoomOut').addEventListener('click',()=>{const r=svg.getBoundingClientRect();zoomAt(.82,r.width/2,r.height/2)}); $('exportButton').addEventListener('click',exportSvg);
  $('reviewButton').addEventListener('click',toggleReviewLens); $('agentContextButton').addEventListener('click',downloadAgentContext); $('aiButton').addEventListener('click',showAIPanel); $('addBlockButton').addEventListener('click',showAddBlockPanel); $('overviewButton').addEventListener('click',()=>{selectedId=null;inspectorMode='overview';showInspector(null);renderTree(window.__blocks||[]);applySelectionAndImpact()}); $('patchButton').addEventListener('click',showPatchQueue); $('downloadPatchButton').addEventListener('click',downloadPatch); $('applyButton').addEventListener('click',()=>applyInMatlab(false)); $('simulateButton').addEventListener('click',requestWorkbenchSimulation);
  $('languageSelect').addEventListener('change',()=>{lang=$('languageSelect').value==='zh'?'zh':'en';try{localStorage.setItem('slx-studio-language',lang)}catch(_){}applyLanguage()});
  systemSelect.addEventListener('change',()=>{selectedId=null;inspectorMode='overview';showInspector(null);render()}); searchBox.addEventListener('input',()=>renderTree(window.__blocks||[]));
  svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.1:.9,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  svg.addEventListener('pointerdown',e=>{if(e.target.closest && e.target.closest('.block'))return;dragging=true;dragStart={x:e.clientX-transform.x,y:e.clientY-transform.y};try{svg.setPointerCapture(e.pointerId)}catch(_){}});
  svg.addEventListener('pointermove',e=>{if(blockDragging){updateBlockMove(e);return}if(connecting){updateConnection(e);return}if(!dragging)return;transform.x=e.clientX-dragStart.x;transform.y=e.clientY-dragStart.y;updateTransform()});
  svg.addEventListener('pointerup',async e=>{if(blockDragging){await finishBlockMove(e);return}if(connecting){await finishConnection(e);return}dragging=false;try{svg.releasePointerCapture(e.pointerId)}catch(_){}});
  svg.addEventListener('pointercancel',e=>{if(blockDragging){const state=blockDragging;blockDragging=null;state.group.setAttribute('transform',`translate(${state.origin.x} ${state.origin.y})`);updateLiveWires(state.block.path,state.origin);state.group.classList.remove('block-dragging')}if(connecting){connecting=null;connectPreview.classList.add('hidden');connectPreview.setAttribute('d','')}dragging=false;try{svg.releasePointerCapture(e.pointerId)}catch(_){}});
  svg.addEventListener('click',e=>{if(e.target===svg||e.target===viewport){selectedId=null;inspectorMode='overview';showInspector(null);renderTree(window.__blocks||[]);renderReviewPanel();applySelectionAndImpact()}});
  window.addEventListener('resize',()=>{if(!dragging)fitView()});
  window.addEventListener('message',event=>{if(event.origin!==location.origin||!event.data)return;if(event.data.type==='slx-studio-run'&&bridgeAvailable)requestWorkbenchSimulation();else if(event.data.type==='slx-simulation-finished'&&event.data.simulation){lastSimulation=event.data.simulation;showSimulationResult(lastSimulation)}else if(event.data.type==='slx-studio-save'){if(staged.size&&bridgeAvailable)$('applyButton').click();else{try{parent.postMessage({type:'slx-model-saved',path:workspacePath},location.origin)}catch(_){}}}else if(event.data.type==='slx-studio-add-block')showAddBlockPanel();else if(event.data.type==='slx-studio-select-block'){const path=String(event.data.block_path||'');let block=(window.__blocks||[]).find(b=>b.path===path);if(!block){const all=[...(sourceModel().blocks||[])];block=all.find(b=>b.path===path);if(block&&systemSelect&&block.system_id){systemSelect.value=block.system_id;render();block=(window.__blocks||[]).find(b=>b.path===path)}}if(block)selectBlock(block.id,true)}});

  if(payload.mode==='diff'){$('reviewButton').classList.remove('hidden');$('reviewButton').classList.add('active');if(payload.agent_context)$('agentContextButton').classList.remove('hidden')}
  const titleModel = payload.mode==='diff' ? `${payload.old.name} → ${payload.new.name}` : payload.model.name; $('modelSubtitle').textContent=titleModel;
  applyLanguage(); detectBridge();
})();
</script>

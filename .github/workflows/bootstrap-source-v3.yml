name: Bootstrap Beta 2 source without workflows

on:
  push:
    paths:
      - 'bootstrap/READY3'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.b64.part-* > /tmp/slx-studio.b64
          base64 --decode /tmp/slx-studio.b64 > /tmp/slx-studio.tar.xz
          mkdir -p /tmp/slx-studio-src
          tar -xJf /tmp/slx-studio.tar.xz -C /tmp/slx-studio-src
          rsync -a --delete --exclude='.git/' --exclude='bootstrap/' --exclude='.github/workflows/' /tmp/slx-studio-src/ ./
          rm -rf bootstrap

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: publish SLX Studio v1.0.0 Beta 2"
          git push

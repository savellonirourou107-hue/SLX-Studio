name: Build Windows desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  electron-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install desktop dependencies
        run: npm ci
      - name: Platform and packaging regressions
        run: npm run test:platform
      - name: Build and package Electron desktop
        run: npm run package:electron
      - name: Launch, save and reopen portable Electron package
        run: npm run test:package
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Electron installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\SLXStudio2.iss'
      - name: Install, launch, reopen and uninstall Electron desktop
        run: npm run test:installer
      - uses: actions/upload-artifact@v4
        with:
          name: SLXStudio-2-Windows-x64
          path: |
            release/SLXStudio-win32-x64
            dist-installer/SLX-Studio-2-Setup-x64.exe

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pywebview .
      - name: Build SLXStudio.exe
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SLXStudio
          --collect-data slxdiff --collect-all webview
          scripts/slx_studio_desktop.py
      - name: Smoke test portable EXE exists
        shell: pwsh
        run: if (-not (Test-Path dist/SLXStudio.exe)) { throw "SLXStudio.exe was not created" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\SLXStudio.iss'
      - name: Smoke test installer exists
        shell: pwsh
        run: if (-not (Test-Path dist-installer/SLX-Studio-Setup-x64.exe)) { throw "SLX-Studio-Setup-x64.exe was not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: SLXStudio-Windows-x64
          path: |
            dist/SLXStudio.exe
            dist-installer/SLX-Studio-Setup-x64.exe

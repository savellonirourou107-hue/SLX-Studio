name: Build Windows desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pywebview .
      - name: Build SLXStudio.exe
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SLXStudio
          --collect-data slxdiff --collect-all webview
          scripts/slx_studio_desktop.py
      - name: Smoke test portable EXE exists
        shell: pwsh
        run: if (-not (Test-Path dist/SLXStudio.exe)) { throw "SLXStudio.exe was not created" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\SLXStudio.iss'
      - name: Smoke test installer exists
        shell: pwsh
        run: if (-not (Test-Path dist-installer/SLX-Studio-Setup-x64.exe)) { throw "SLX-Studio-Setup-x64.exe was not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: SLXStudio-Windows-x64
          path: |
            dist/SLXStudio.exe
            dist-installer/SLX-Studio-Setup-x64.exe

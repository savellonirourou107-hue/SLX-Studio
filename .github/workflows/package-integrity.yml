name: Package integrity

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel from source distribution and validate metadata
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Smoke-test the installed wheel outside the source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/slx-wheel-smoke"
          "$RUNNER_TEMP/slx-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/slx-wheel-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/slx-wheel-smoke/bin/slx-diff" --help
          "$RUNNER_TEMP/slx-wheel-smoke/bin/python" - <<'PY'
          from importlib import metadata, resources
          from pathlib import Path
          import slxdiff
          import sys

          assert Path(slxdiff.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert resources.files("slxdiff").joinpath("studio.html").is_file()
          assert resources.files("slxdiff").joinpath("workbench.html").is_file()
          print("Installed distribution:", metadata.version("slx-studio"))
          PY
      - name: Record the exact tracked source and distribution checksums
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=SLX-Studio/ --output=dist/SLX-Studio-source.tar.gz HEAD
          git rev-parse HEAD > dist/REVISION.txt
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          directory = Path("dist")
          lines = [f"{sha256(p.read_bytes()).hexdigest()}  {p.name}\n"
                   for p in sorted(directory.iterdir()) if p.is_file()]
          (directory / "SHA256SUMS").write_text("".join(lines), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
